name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Do not interrupt an in-flight migration/deployment. Pending runs may be replaced.
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.APP_ORIGIN }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Skip superseded commits
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipped: main has a newer commit. Deploy the latest main instead." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/setup-node@v6
        if: steps.current.outputs.deploy == 'true'
        with:
          node-version: 24.22.3
      - uses: oven-sh/setup-bun@v2
        if: steps.current.outputs.deploy == 'true'
        with:
          bun-version: 1.4.4
          no-cache: true
      - name: Verify runtime security
        if: steps.current.outputs.deploy == 'true'
        run: bun run security:runtime
      - name: Install dependencies
        if: steps.current.outputs.deploy == 'true'
        run: bun install --frozen-lockfile
      # buildはCloudflare公式Vite pluginで行う。配備用Secretsは渡さない。
      - name: Build application
        if: steps.current.outputs.deploy == 'true'
        run: bun run build
      - name: Validate settings, ensure state store, plan and deploy
        if: steps.current.outputs.deploy == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          APP_ORIGIN: ${{ vars.APP_ORIGIN }}
          APP_RELEASE: ${{ github.sha }}
          JOBS_ENABLED: ${{ vars.JOBS_ENABLED || 'false' }}
          MAINTENANCE_MODE: ${{ vars.MAINTENANCE_MODE || 'false' }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          SIGNUP_ALLOWED_EMAILS: ${{ secrets.SIGNUP_ALLOWED_EMAILS }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ vars.VAPID_SUBJECT }}
          ALCHEMY_TELEMETRY_DISABLED: '1'
        run: |
          database_name=$(bun -e '
            import { deploymentSchema, deploymentResources } from "./infra/config";
            const required = ["CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN", "APP_ORIGIN", "APP_RELEASE", "BETTER_AUTH_SECRET", "GOOGLE_CLIENT_ID", "GOOGLE_CLIENT_SECRET", "SIGNUP_ALLOWED_EMAILS", "VAPID_PUBLIC_KEY", "VAPID_PRIVATE_KEY", "VAPID_SUBJECT"];
            const missing = required.filter((key) => !process.env[key]?.trim());
            if (missing.length) throw new Error("Missing production settings: " + missing.join(", "));
            if (process.env.BETTER_AUTH_SECRET.length < 32) throw new Error("BETTER_AUTH_SECRET must contain at least 32 characters");
            const result = deploymentSchema.safeParse({ stage: "production", origin: process.env.APP_ORIGIN, release: process.env.APP_RELEASE, jobs: process.env.JOBS_ENABLED, maintenance: process.env.MAINTENANCE_MODE });
            if (!result.success) throw new Error("Invalid production origin, release, or boolean setting");
            console.log(deploymentResources(result.data).database.name);
          ')

          export WRANGLER_SEND_METRICS=false
          databases=$(bunx --no-install wrangler d1 list --json)
          database_exists=$(bun -e '
            const databases = await Bun.stdin.json();
            if (!Array.isArray(databases) || databases.some(db => typeof db?.name !== "string")) throw new Error("Unexpected D1 list response");
            console.log(databases.some(db => db.name === process.argv[1]));
          ' "$database_name" <<< "$databases")
          cutover_before=""
          if [ "$database_exists" = "true" ]; then
            schema=$(bunx --no-install wrangler d1 execute "$database_name" --remote --json --command "
              SELECT CASE
                WHEN EXISTS (SELECT 1 FROM pragma_table_info('teams') WHERE name='todo_categories') THEN '0014_'
                WHEN EXISTS (SELECT 1 FROM sqlite_schema WHERE type='table' AND name IN ('shared_pages','shared_page_creations')) THEN '0015_'
                ELSE '' END AS cutoff")
            cutover_before=$(bun -e '
              const [query] = await Bun.stdin.json();
              const cutoff = query?.results?.[0]?.cutoff;
              if (query?.success !== true || !["", "0014_", "0015_"].includes(cutoff)) throw new Error("Unexpected D1 schema response");
              console.log(cutoff);
            ' <<< "$schema")
          fi

          bun run infra:bootstrap --no-input
          if [ -n "$cutover_before" ]; then
            # Switch to the compatible Worker before dropping tables used by the old release.
            migration_prefix=$(mktemp -d)
            trap 'rm -rf -- "$migration_prefix"' EXIT
            for migration in migrations/*.sql; do
              if [[ "${migration##*/}" < "$cutover_before" ]]; then
                cp -- "$migration" "$migration_prefix/"
              fi
            done
            D1_MIGRATIONS_DIR="$migration_prefix" bun run infra:plan --stage production --no-input
            D1_MIGRATIONS_DIR="$migration_prefix" bun run deploy --stage production --yes --no-input
            for attempt in {1..12}; do
              if node scripts/verify-cutover-release.mjs; then
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                echo 'The new Worker did not become live. D1 cleanup was not run.' >&2
                exit 1
              fi
              sleep 5
            done
          fi
          bun run infra:plan --stage production --no-input
          bun run deploy --stage production --yes --no-input
