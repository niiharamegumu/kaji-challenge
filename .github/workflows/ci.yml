name: CI
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cloudflare-quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate GitHub Actions workflows
        working-directory: .
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - uses: actions/setup-node@v6
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
          no-cache: true
      - run: bun run security:runtime
      - run: bun install --frozen-lockfile
      - run: bun audit --audit-level moderate
      - run: bunx playwright install --with-deps chromium
      - name: Verify build, SPA shell, D1, and selected browser behavior
        env:
          KAJI_CI_BASE: ${{ github.event.pull_request.base.sha }}
        run: bun run test:ci
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: local-verification-results
          path: app/test-results
