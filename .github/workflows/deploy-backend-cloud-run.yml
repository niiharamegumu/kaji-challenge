name: Deploy Backend to Cloud Run

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "api/**"
      - ".github/workflows/deploy-backend-cloud-run.yml"

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE: kaji-backend
  REGION: asia-northeast1
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run DB migrations
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL secret is empty" && exit 1)
          go run -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.0 \
            -path backend/migrations \
            -database "$DATABASE_URL" \
            up

      - name: Configure Docker auth
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Set image refs
        run: |
          IMAGE_SHA="asia-northeast1-docker.pkg.dev/${PROJECT_ID}/kaji/kaji-backend:${GITHUB_SHA}"
          IMAGE_LATEST="asia-northeast1-docker.pkg.dev/${PROJECT_ID}/kaji/kaji-backend:latest"
          echo "IMAGE_SHA=$IMAGE_SHA" >> $GITHUB_ENV
          echo "IMAGE_LATEST=$IMAGE_LATEST" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.IMAGE_SHA }}
            ${{ env.IMAGE_LATEST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Roll out Cloud Run service and jobs
        run: |
          set -euo pipefail
          JOB_CONCURRENCY=3
          jobs_file="$(mktemp)"
          cleanup() {
            rm -f "$jobs_file"
          }
          trap cleanup EXIT

          cat <<'EOF' > "$jobs_file"
          close:day:kaji-backend-close-day
          close:week:kaji-backend-close-week
          close:month:kaji-backend-close-month
          notify:daily_2100:kaji-backend-notify-daily-2100
          notify:weekly_prev_sat_1900:kaji-backend-notify-weekly-prev-sat-1900
          notify:weekly_due_sun_1000:kaji-backend-notify-weekly-due-sun-1000
          EOF

          (
            set -euo pipefail
            gcloud run deploy "$SERVICE" \
              --image "$IMAGE_SHA" \
              --region "$REGION" \
              --platform managed \
              --allow-unauthenticated
          ) &
          service_pid=$!

          xargs -a "$jobs_file" -P "$JOB_CONCURRENCY" -I{} bash -c '
            set -euo pipefail
            IFS=":" read -r kind arg job_name <<< "$1"

            case "$kind" in
              close)
                gcloud run jobs update "$job_name" \
                  --region "$REGION" \
                  --image "$IMAGE_SHA" \
                  --command "/app/ops" \
                  --args "close,--scope,${arg},--all-teams"
                ;;
              notify)
                gcloud run jobs update "$job_name" \
                  --region "$REGION" \
                  --image "$IMAGE_SHA" \
                  --command "/app/ops" \
                  --args "notify,--slot,${arg}"
                ;;
              *)
                echo "Unknown rollout kind: $kind" >&2
                exit 1
                ;;
            esac
          ' _ "{}" &
          jobs_pid=$!

          service_status=0
          jobs_status=0

          wait "$service_pid" || service_status=$?

          wait "$jobs_pid" || jobs_status=$?

          if [ "$service_status" -ne 0 ] || [ "$jobs_status" -ne 0 ]; then
            echo "Rollout failed (service=$service_status jobs=$jobs_status)" >&2
            exit 1
          fi

      - name: Verify Cloud Run Jobs image
        run: |
          set -euo pipefail
          JOB_CONCURRENCY=3
          jobs_file="$(mktemp)"
          results_file="$(mktemp)"
          cleanup() {
            rm -f "$jobs_file" "$results_file"
          }
          trap cleanup EXIT

          cat <<'EOF' > "$jobs_file"
          kaji-backend-close-day
          kaji-backend-close-week
          kaji-backend-close-month
          kaji-backend-notify-daily-2100
          kaji-backend-notify-weekly-prev-sat-1900
          kaji-backend-notify-weekly-due-sun-1000
          EOF

          xargs -a "$jobs_file" -P "$JOB_CONCURRENCY" -I{} bash -c '
            set -euo pipefail
            job_name="$1"
            image=$(gcloud run jobs describe "$job_name" \
              --region "$REGION" \
              --format="value(template.template.containers[0].image)")
            printf "%s\t%s\n" "$job_name" "$image"
          ' _ "{}" | tee "$results_file"

          mismatches=$(
            awk -F '\t' -v expected="$IMAGE_SHA" '$2 != expected { print $1 ": " $2 }' "$results_file"
          )

          if [ -n "$mismatches" ]; then
            echo "Cloud Run Jobs image verification failed:" >&2
            echo "$mismatches" >&2
            exit 1
          fi
