openapi: 3.0.3
info:
  title: KajiChalle API
  version: 0.3.0
servers:
  - url: http://localhost:8080
security:
  - cookieAuth: []
paths:
  /health:
    get:
      operationId: health
      security: []
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /v1/auth/google/start:
    get:
      operationId: getAuthGoogleStart
      security: []
      summary: Start Google OIDC authorization
      responses:
        '200':
          description: Authorization URL generated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStartResponse'

  /v1/auth/google/callback:
    get:
      operationId: getAuthGoogleCallback
      security: []
      summary: Handle Google OIDC callback and issue one-time exchange code
      parameters:
        - in: query
          name: code
          required: true
          schema:
            type: string
        - in: query
          name: state
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Callback handled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthCallbackResponse'

  /v1/auth/sessions/exchange:
    post:
      operationId: postAuthSessionsExchange
      security: []
      summary: Exchange one-time code for app session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthSessionExchangeRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSessionResponse'

  /v1/auth/logout:
    post:
      operationId: postAuthLogout
      summary: Revoke current session token
      responses:
        '204':
          description: Logged out

  /v1/me:
    get:
      operationId: getMe
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
  /v1/me/nickname:
    patch:
      operationId: patchMeNickname
      summary: Update current user nickname
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNicknameRequest'
      responses:
        '200':
          description: Nickname updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateNicknameResponse'
  /v1/me/color:
    patch:
      operationId: patchMeColor
      summary: Update current user color
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateColorRequest'
      responses:
        '200':
          description: Color updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateColorResponse'

  /v1/push/subscriptions:
    post:
      operationId: postPushSubscription
      summary: Upsert current device push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPushSubscriptionRequest'
      responses:
        '200':
          description: Subscription upserted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushSubscription'

  /v1/push/subscriptions/{subscriptionId}:
    delete:
      operationId: deletePushSubscription
      summary: Deactivate a current user's push subscription
      parameters:
        - in: path
          name: subscriptionId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Subscription deactivated

  /v1/push/subscriptions/me:
    get:
      operationId: getPushSubscriptionsMe
      summary: List current user's push subscriptions
      responses:
        '200':
          description: Push subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListPushSubscriptionsResponse'

  /v1/teams/invites:
    post:
      operationId: postTeamInvite
      summary: Create invite code
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInviteRequest'
      responses:
        '201':
          description: Invite created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCodeResponse'
  /v1/teams/invites/current:
    get:
      operationId: getTeamCurrentInvite
      summary: Get current team invite code
      responses:
        '200':
          description: Current invite
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InviteCodeResponse'
  /v1/teams/current:
    patch:
      operationId: patchTeamCurrent
      summary: Update current team name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCurrentTeamRequest'
      responses:
        '200':
          description: Team updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamInfoResponse'
  /v1/teams/current/members:
    get:
      operationId: getTeamCurrentMembers
      summary: List current team members by joined date
      responses:
        '200':
          description: Team members
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMembersResponse'

  /v1/teams/join:
    post:
      operationId: postTeamJoin
      summary: Join team by invite code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinTeamRequest'
      responses:
        '200':
          description: Joined
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinTeamResponse'
  /v1/teams/leave:
    post:
      operationId: postTeamLeave
      summary: Leave current team and create a new own team
      responses:
        '200':
          description: Left and recreated own team
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinTeamResponse'

  /v1/tasks:
    get:
      operationId: listTasks
      summary: List tasks in current team
      parameters:
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/TaskType'
      responses:
        '200':
          description: List tasks
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
    post:
      operationId: postTask
      summary: Create task
      description: Requires the latest team revision via the If-Match header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Task created
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header

  /v1/tasks/reorder:
    post:
      operationId: postTasksReorder
      summary: Reorder tasks
      description: Requires the latest team revision via the If-Match header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderTasksRequest'
      responses:
        '200':
          description: Tasks reordered
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header

  /v1/tasks/{taskId}:
    patch:
      operationId: patchTask
      summary: Update task
      description: Requires the latest team revision via the If-Match header.
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaskRequest'
      responses:
        '200':
          description: Task updated
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header
    delete:
      operationId: deleteTask
      summary: Delete task
      description: Requires the latest team revision via the If-Match header.
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Task deleted
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header

  /v1/tasks/{taskId}/completions/toggle:
    post:
      operationId: postTaskCompletionToggle
      summary: Update task completion in target period
      description: Requires the latest team revision via the If-Match header.
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ToggleTaskCompletionRequest'
      responses:
        '200':
          description: Completion toggled
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskCompletionResponse'
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header

  /v1/reminders:
    get:
      operationId: listReminders
      summary: List future reminder occurrences in current team
      parameters:
        - in: query
          name: from
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: to
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Reminder occurrences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderCalendarResponse'
    post:
      operationId: postReminder
      summary: Create reminder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReminderRequest'
      responses:
        '201':
          description: Reminder created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'

  /v1/reminders/list:
    get:
      operationId: listReminderDefinitions
      summary: List reminder definitions in current team
      responses:
        '200':
          description: Reminder definitions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReminderListResponse'

  /v1/reminders/{reminderId}:
    patch:
      operationId: patchReminder
      summary: Update reminder
      parameters:
        - in: path
          name: reminderId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReminderRequest'
      responses:
        '200':
          description: Reminder updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reminder'
    delete:
      operationId: deleteReminder
      summary: Delete reminder
      parameters:
        - in: path
          name: reminderId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Reminder deleted

  /v1/penalty-rules:
    get:
      operationId: listPenaltyRules
      summary: List penalty rules in current team
      parameters:
        - in: query
          name: includeDeleted
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Penalty rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PenaltyRule'
    post:
      operationId: postPenaltyRule
      summary: Create penalty rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePenaltyRuleRequest'
      responses:
        '201':
          description: Penalty rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenaltyRule'

  /v1/penalty-rules/{ruleId}:
    patch:
      operationId: patchPenaltyRule
      summary: Update penalty rule
      parameters:
        - in: path
          name: ruleId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePenaltyRuleRequest'
      responses:
        '200':
          description: Penalty rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PenaltyRule'
    delete:
      operationId: deletePenaltyRule
      summary: Delete penalty rule
      parameters:
        - in: path
          name: ruleId
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Penalty rule deleted

  /v1/shopping-items:
    get:
      operationId: listShoppingItems
      summary: List shopping items in current team
      responses:
        '200':
          description: Shopping items
          headers:
            ETag:
              description: Current team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingListItem'
    post:
      operationId: postShoppingItem
      summary: Create shopping item
      description: Requires the latest team revision via the If-Match header.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateShoppingListItemRequest'
      responses:
        '201':
          description: Shopping item created
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header

  /v1/shopping-items/{itemId}:
    patch:
      operationId: patchShoppingItem
      summary: Update shopping item
      description: Requires the latest team revision via the If-Match header.
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateShoppingListItemRequest'
      responses:
        '200':
          description: Shopping item updated
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShoppingListItem'
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header
    delete:
      operationId: deleteShoppingItem
      summary: Delete shopping item
      description: Requires the latest team revision via the If-Match header.
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            type: string
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Shopping item deleted
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header

  /v1/shopping-items/reorder:
    post:
      operationId: postShoppingItemsReorder
      summary: Reorder shopping items
      description: Requires the latest team revision via the If-Match header.
      parameters:
        - in: header
          name: If-Match
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderShoppingListItemsRequest'
      responses:
        '200':
          description: Shopping items reordered
          headers:
            ETag:
              description: Updated team revision ETag
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ShoppingListItem'
        '412':
          description: Team revision mismatch
        '428':
          description: Missing If-Match header

  /v1/tasks/overview:
    get:
      operationId: getTaskOverview
      summary: Task overview payload
      responses:
        '200':
          description: Task overview payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOverviewResponse'

  /v1/penalty-summaries/monthly:
    get:
      operationId: getPenaltySummaryMonthly
      summary: Monthly penalty summary
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\\d{4}-\\d{2}$'
      responses:
        '200':
          description: Monthly summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyPenaltySummary'

  /v1/admin/close-day:
    post:
      operationId: postAdminCloseDay
      summary: Run day close now
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseResponse'

  /v1/admin/close-week:
    post:
      operationId: postAdminCloseWeek
      summary: Run week close now
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseResponse'

  /v1/admin/close-month:
    post:
      operationId: postAdminCloseMonth
      summary: Run month close now
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CloseResponse'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: kaji_session

  schemas:
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string

    HealthResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: ok

    AuthStartResponse:
      type: object
      required: [authorizationUrl]
      properties:
        authorizationUrl:
          type: string
          format: uri

    AuthCallbackResponse:
      type: object
      required: [exchangeCode]
      properties:
        exchangeCode:
          type: string

    AuthSessionExchangeRequest:
      type: object
      required: [exchangeCode]
      properties:
        exchangeCode:
          type: string
          minLength: 1

    AuthSessionResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      required: [id, email, displayName, createdAt]
      properties:
        id:
          type: string
        email:
          type: string
        displayName:
          type: string
        colorHex:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    MeResponse:
      type: object
      required: [user, memberships]
      properties:
        user:
          $ref: '#/components/schemas/User'
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/TeamMembership'

    TeamMembership:
      type: object
      required: [teamId, role, teamName]
      properties:
        teamId:
          type: string
        role:
          type: string
          enum: [owner, member]
        teamName:
          type: string

    CreateInviteRequest:
      type: object
      properties:
        expiresInHours:
          type: integer
          minimum: 1
          maximum: 720
          default: 72

    InviteCodeResponse:
      type: object
      required: [code, teamId, expiresAt]
      properties:
        code:
          type: string
        teamId:
          type: string
        expiresAt:
          type: string
          format: date-time

    JoinTeamRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 6
          maxLength: 64

    JoinTeamResponse:
      type: object
      required: [teamId]
      properties:
        teamId:
          type: string

    UpdateCurrentTeamRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50

    TeamInfoResponse:
      type: object
      required: [teamId, name]
      properties:
        teamId:
          type: string
        name:
          type: string

    TeamMember:
      type: object
      required: [userId, displayName, effectiveName, joinedAt, role]
      properties:
        userId:
          type: string
        displayName:
          type: string
        nickname:
          type: string
          nullable: true
        effectiveName:
          type: string
        colorHex:
          type: string
          nullable: true
        joinedAt:
          type: string
          format: date-time
        role:
          type: string
          enum: [owner, member]

    TeamMembersResponse:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TeamMember'

    UpdateNicknameRequest:
      type: object
      required: [nickname]
      properties:
        nickname:
          type: string
          maxLength: 30

    UpdateNicknameResponse:
      type: object
      required: [nickname, effectiveName]
      properties:
        nickname:
          type: string
        effectiveName:
          type: string

    UpdateColorRequest:
      type: object
      required: [colorHex]
      properties:
        colorHex:
          type: string
          nullable: true

    UpdateColorResponse:
      type: object
      required: [colorHex]
      properties:
        colorHex:
          type: string
          nullable: true

    PushPlatform:
      type: string
      enum: [ios_safari_pwa]

    PushSubscription:
      type: object
      required: [id, teamId, userId, endpoint, platform, isActive, lastSeenAt, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        userId:
          type: string
        endpoint:
          type: string
          format: uri
        userAgent:
          type: string
          nullable: true
        platform:
          $ref: '#/components/schemas/PushPlatform'
        isActive:
          type: boolean
        lastSeenAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PushSubscriptionKeys:
      type: object
      required: [p256dh, auth]
      properties:
        p256dh:
          type: string
          minLength: 1
        auth:
          type: string
          minLength: 1

    UpsertPushSubscriptionRequest:
      type: object
      required: [endpoint, keys, platform]
      properties:
        endpoint:
          type: string
          format: uri
        keys:
          $ref: '#/components/schemas/PushSubscriptionKeys'
        userAgent:
          type: string
        platform:
          $ref: '#/components/schemas/PushPlatform'

    ListPushSubscriptionsResponse:
      type: object
      required: [items, vapidPublicKey]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PushSubscription'
        vapidPublicKey:
          type: string

    TaskType:
      type: string
      enum: [daily, weekly]

    ReminderKind:
      type: string
      enum: [one_time, recurring]

    ReminderScheduleType:
      type: string
      enum: [daily, weekly, monthly]

    Reminder:
      type: object
      required: [id, teamId, title, kind, startDate, createdAt, updatedAt]
      properties:
        id:
          type: string
        teamId:
          type: string
        title:
          type: string
        notes:
          type: string
          nullable: true
        kind:
          $ref: '#/components/schemas/ReminderKind'
        scheduleType:
          $ref: '#/components/schemas/ReminderScheduleType'
          nullable: true
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
